# GNOME Shell extensions, in the order they're installed.
#
#   source = "ego"      extensions.gnome.org, the build for the running GNOME
#   source = "github"   a GitHub repository: the head of `branch`, or exactly
#                       `commit` when pinned; `build` is run in the checkout
#                       and `artifact` is the zip it produces (without `build`
#                       the repository root is the extension)
#   settings            dconf template in dconf/extensions/ (reset, then loaded)
#   dconf               the extension's settings folder
#   pin_version         stamp this version into metadata.json after installing,
#                       so GNOME's automatic updates and Extension Manager never
#                       replace the build; `knirby-gnomedots update` still
#                       upgrades it, tracking the real version on its own

[[extension]]
uuid = "arcmenu@arcmenu.com"
name = "ArcMenu"
source = "ego"
settings = "arcmenu.ini"
dconf = "/org/gnome/shell/extensions/arcmenu/"

[[extension]]
uuid = "blur-my-shell@aunetx"
name = "Blur my Shell"
# Built from this exact upstream commit, not the extensions.gnome.org release.
source = "github"
repo = "aunetx/blur-my-shell"
commit = "99660f4e87eab4ea1e02e39e79cebf7cfa320dbb"
build = ["make", "build"]
artifact = "build/blur-my-shell@aunetx.shell-extension.zip"
pin_version = 9999
settings = "blur-my-shell.ini"
dconf = "/org/gnome/shell/extensions/blur-my-shell/"

