uuids = [
    "ubuntu-dock@ubuntu.com",                       # second dock beside Dash to Dock
    "ubuntu-appindicators@ubuntu.com",              # tray icons twice, beside AppIndicator Support
    "ding@rastersoft.com",                          # older desktop icons, beside Desktop Icons NG
    "dash-to-panel@jderose9.github.com",            # replaces the top bar this setup styles
    "apps-menu@gnome-shell-extensions.gcampax.github.com",   # second menu beside ArcMenu
    "places-menu@gnome-shell-extensions.gcampax.github.com",
    "window-list@gnome-shell-extensions.gcampax.github.com",
]
