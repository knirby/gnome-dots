# Global Menu: the focused app's real menu bar in the top bar, plus the logo menu (About This Linux,
# Force Quit, Sleep, Restart, Shut Down...). The logo is this distribution's own, its square mark when
# one is installed; the extension finds it from /etc/os-release.

[org/gnome/shell/extensions/gnome-global-menu]
accel-style='mac'
app-name-gap=0
app-name-max-chars=30
app-name-style='normal'
item-padding=5
item-spacing=6
logo-about-label='About This Linux'
logo-enabled=true
logo-fix-os-logo=true
logo-keep-aspect=true
logo-padding-left=0
logo-padding-right=0
logo-recolor=true
logo-size=15
logo-source='distro'
offset-x=-3
offset-y=0
panel-index=2
show-app-icon=false
show-app-name=true
show-divider=false
show-icons=true
