# Astra Monitor: CPU, memory, disk, network and sensors in the top bar.
# The CPU temperature, fan, GPU and disk are detected per machine by the sysmon module.

[org/gnome/shell/extensions/astra-monitor]
compact-mode=false
gpu-header-activity-bar=false
gpu-header-activity-graph=true
gpu-header-activity-graph-width=40
gpu-header-activity-percentage=true
gpu-header-memory-bar=false
gpu-header-memory-graph-width=40
gpu-header-show=false
gpu-indicators-order='["icon","activity bar","activity graph","activity percentage","memory bar","memory graph","memory percentage","memory value"]'
headers-height=0
headers-height-override=0
memory-header-bars-color1='rgb(255,255,255)'
memory-header-bars-color2='rgba(191,64,64,0)'
memory-header-icon-alert-color='rgb(246,97,81)'
memory-header-icon-size=18
memory-header-percentage=true
memory-header-percentage-icon-alert-threshold=90
memory-indicators-order='["icon","percentage","bar","graph","value","free"]'
memory-update=1.9999999999999991
monitors-order='["processor","gpu","memory","storage","network","sensors"]'
network-header-bars=false
network-header-graph-width=40
network-header-io=true
network-header-io-figures=3
network-header-io-graph-color1='rgb(87,227,137)'
network-header-io-graph-color2='rgb(255,255,255)'
network-header-io-layout='vertical'
network-indicators-order='["icon","IO bar","IO graph","IO speed"]'
processor-header-bars=false
processor-header-bars-breakdown=false
processor-header-bars-core=false
processor-header-graph=true
processor-header-graph-breakdown=true
processor-header-graph-color1='rgba(255,255,255,0.64)'
processor-header-graph-color2='rgb(255,163,72)'
processor-header-graph-width=40
processor-header-icon=true
processor-header-icon-alert-color='rgb(246,97,81)'
processor-header-icon-custom=''
processor-header-icon-size=17
processor-header-percentage=false
processor-header-percentage-core=false
processor-header-percentage-icon-alert-threshold=90
processor-header-show=true
processor-header-tooltip=true
processor-header-tooltip-percentage=true
processor-indicators-order='["icon","percentage","bar","graph","frequency"]'
processor-menu-bars-breakdown=true
processor-menu-gpu-color=''
processor-update=0.99999999999999967
sensors-header-icon-size=14
sensors-header-sensor1-digits=-1
sensors-header-sensor1-show=true
sensors-header-sensor2-digits=-1
sensors-header-sensor2-layout='horizontal'
sensors-header-sensor2-show=true
sensors-header-show=true
sensors-indicators-order='["icon","value"]'
sensors-update=1.0
storage-header-bars-color1='rgb(255,255,255)'
storage-header-free=false
storage-header-graph=true
storage-header-graph-width=40
storage-header-io-graph-color1='rgb(255,255,255)'
storage-header-io-graph-color2='rgb(87,227,137)'
storage-header-value=false
storage-indicators-order='["icon","bar","percentage","value","free","IO bar","IO graph","IO speed"]'
theme-style='dark'
