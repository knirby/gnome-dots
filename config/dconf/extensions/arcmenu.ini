# ArcMenu: the start menu on the left of the top bar (Super+M).

[org/gnome/shell/extensions/arcmenu]
arcmenu-hotkey=['<Super>m']
arcmenu-hotkey-overlay-key-enabled=true
eleven-layout-extra-shortcuts=@ARCMENU_SHORTCUTS@
eleven-show-frequent-apps=false
hotkey-open-primary-monitor=false
icon-size-apps=-1
icon-size-buttons=-1
icon-size-categories=-1
icon-size-misc=-1
icon-size-shortcuts=-1
left-panel-width=390
menu-arrow-rise=(true, 6)
menu-background-color='rgba(34,34,38,0.32)'
menu-border-color='rgba(56,56,59,0.64)'
menu-border-radius=15
menu-border-width=2
menu-button-appearance='Icon'
menu-button-icon-size=20
menu-button-padding=4
menu-button-position-offset=0
menu-font-size=12
menu-foreground-color='rgb(255,255,255)'
menu-height=550
menu-item-active-bg-color='rgba(228,228,226,0.15)'
menu-item-active-fg-color='rgb(255,255,255)'
menu-item-hover-bg-color='rgba(238,238,236,0.08)'
menu-item-hover-fg-color='rgb(255,255,255)'
menu-layout='11'
menu-separator-color='rgba(56,56,59,0.8)'
menu-themes=[['ArcMenu Style', 'rgba(48,48,49,0.98)', 'rgb(223,223,223)', 'rgb(60,60,60)', '1', '14', '11', 'rgba(255,255,255,0.1)', 'rgb(21,83,158)', 'rgb(255,255,255)', 'rgb(25,98,163)', 'rgb(255,255,255)'], ['Simply Dark', 'rgba(28,28,28,0.98)', 'rgb(211,218,227)', 'rgb(63,62,64)', '1', '14', '11', 'rgb(63,62,64)', 'rgba(238,238,236,0.08)', 'rgb(255,255,255)', 'rgba(228,228,226,0.15)', 'rgb(255,255,255)'], ['Dark Blue', 'rgb(30,37,41)', 'rgb(189,230,251)', 'rgb(41,50,55)', '1', '14', '11', 'rgba(99,99,98,0.56)', 'rgba(189,230,251,0.08)', 'rgb(189,230,251)', 'rgba(189,230,251,0.15)', 'rgb(189,230,251)'], ['Light Blue', 'rgb(245,247,250)', 'rgb(18,51,84)', 'rgba(18,51,84,0.2)', '1', '14', '11', 'rgba(18,51,84,0.15)', 'rgba(18,51,84,0.08)', 'rgb(18,51,84)', 'rgba(18,51,84,0.15)', 'rgb(18,51,84)'], ['KnirbyDots', 'rgba(34,34,38,0.32)', 'rgb(255,255,255)', 'rgba(56,56,59,0.64)', '2', '15', '12', 'rgba(56,56,59,0.8)', 'rgba(238,238,236,0.08)', 'rgb(255,255,255)', 'rgba(228,228,226,0.15)', 'rgb(255,255,255)']]
menu-width-adjustment=0
override-menu-theme=true
pinned-apps=@ARCMENU_PINNED@
position-in-panel='Left'
power-options=[(0, true), (1, true), (2, true), (3, true), (4, true), (5, false), (6, true), (7, true)]
right-panel-width=280
search-entry-border-radius=(true, 25)
update-notifier-project-version=@ARCMENU_VERSION@
