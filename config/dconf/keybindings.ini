# Keyboard shortcuts. Super+T opens the terminal: that one is added by the
# keybindings module (it depends on which terminal is installed) next to any
# custom shortcuts already there. Extension shortcuts live with their
# extension: ArcMenu Super+M, clipboard Super+V, launcher Super+Space.

[org/gnome/desktop/wm/keybindings]
begin-move=@as []
begin-resize=@as []
close=['<Super>x']
maximize=['<Super>Up']
minimize=['<Super>Down']
move-to-monitor-down=@as []
move-to-monitor-up=@as []
move-to-workspace-1=['<Shift><Super>1']
move-to-workspace-2=['<Shift><Super>2']
move-to-workspace-3=['<Shift><Super>3']
move-to-workspace-4=['<Shift><Super>4']
panel-run-dialog=['<Super>r']
show-desktop=['<Super>d']
switch-applications=['<Alt>Tab']
switch-applications-backward=['<Shift><Alt>Tab']
switch-input-source=['<Control><Super>space']
switch-input-source-backward=['<Shift><Control><Super>space']
switch-to-workspace-1=['<Super>1']
switch-to-workspace-2=['<Super>2']
switch-to-workspace-3=['<Super>3']
switch-to-workspace-4=['<Super>4']
switch-to-workspace-left=['<Super>Left', '<Super>Page_Up', '<Super>KP_Prior', '<Super><Alt>Left', '<Control><Alt>Left']
switch-to-workspace-right=['<Super>Right', '<Super>Page_Down', '<Super>KP_Next', '<Super><Alt>Right', '<Control><Alt>Right']
toggle-fullscreen=['<Shift><Super>Up']
toggle-maximized=@as []
unmaximize=@as []

[org/gnome/mutter/keybindings]
toggle-tiled-left=@as []
toggle-tiled-right=@as []

[org/gnome/mutter/wayland/keybindings]
restore-shortcuts=@as []

[org/gnome/shell/keybindings]
focus-active-notification=@as []
open-new-window-application-1=@as []
open-new-window-application-2=@as []
open-new-window-application-3=@as []
open-new-window-application-4=@as []
open-new-window-application-5=@as []
open-new-window-application-6=@as []
open-new-window-application-7=@as []
open-new-window-application-8=@as []
open-new-window-application-9=@as []
screenshot=['<Shift><Super>s', '<Shift>Print']
show-screenshot-ui=['<Control><Super>s', 'Print']
switch-to-application-1=@as []
switch-to-application-2=@as []
switch-to-application-3=@as []
switch-to-application-4=@as []
switch-to-application-5=@as []
switch-to-application-6=@as []
switch-to-application-7=@as []
switch-to-application-8=@as []
switch-to-application-9=@as []
toggle-application-view=['<Super>a']
toggle-message-tray=['<Super>n']
toggle-quick-settings=@as []

[org/gnome/settings-daemon/plugins/media-keys]
control-center=['<Super>comma']
home=['<Super>e']
magnifier=['<Super>dead_acute']
magnifier-zoom-in=['<Super>plus']
magnifier-zoom-out=['<Super>minus']
screenreader=@as []
search=['<Super>s']
