# Desktop look and behaviour: theme, fonts, icons, cursor, clock, windows.
# Loaded into dconf as is; keys not listed keep their current value.

[org/gnome/desktop/interface]
accent-color='orange'
clock-show-date=false
clock-show-seconds=true
clock-show-weekday=true
color-scheme='prefer-dark'
cursor-blink=true
cursor-blink-time=1200
cursor-blink-timeout=10
cursor-size=24
cursor-theme='Bibata-Modern-Ice'
document-font-name='Noto Serif Medium 11'
enable-animations=true
enable-hot-corners=false
font-antialiasing='rgba'
font-hinting='medium'
font-name='Noto Sans Medium 11'
gtk-enable-primary-paste=true
gtk-theme='Adwaita-dark'
icon-theme='Mint-Y-Grey'
monospace-font-name='Fira Code Medium 11 @wght=500'
overlay-scrolling=true
text-scaling-factor=0.9
toolbar-icons-size='large'
toolbar-style='both-horiz'

[org/gnome/desktop/wm/preferences]
action-double-click-titlebar='toggle-maximize'
action-middle-click-titlebar='lower'
action-right-click-titlebar='menu'
audible-bell=false
button-layout='appmenu:minimize,maximize,close'
focus-mode='click'
focus-new-windows='smart'
mouse-button-modifier='<Super>'
num-workspaces=2
raise-on-click=true
resize-with-right-button=true
titlebar-font='Noto Sans Bold 10'
titlebar-uses-system-font=false
visual-bell=false
workspace-names=['Main', 'Secondary']

[org/gnome/mutter]
center-new-windows=true
dynamic-workspaces=false
overlay-key='Super_L'
workspaces-only-on-primary=false

[org/gnome/settings-daemon/plugins/xsettings]
overrides={'Gtk/ShellShowsAppMenu': <0>, 'Gtk/DecorationLayout': <'menu:minimize,maximize,close'>}

[org/gnome/desktop/calendar]
show-weekdate=true

[org/gnome/desktop/datetime]
automatic-timezone=true

[org/gnome/desktop/privacy]
recent-files-max-age=7
remember-recent-files=true

[org/gnome/shell/weather]
automatic-location=true

[org/gnome/tweaks]
show-extensions-notice=false
