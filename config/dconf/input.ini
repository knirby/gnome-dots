# Flat mouse acceleration (pointer speed is left as you set it) and num lock. Keyboard layouts are deliberately left alone.
# Its own module ("input") so it can be skipped: --skip input

[org/gnome/desktop/peripherals/keyboard]
numlock-state=true

[org/gnome/desktop/peripherals/mouse]
accel-profile='flat'
double-click=400
drag-threshold=8
left-handed=false
middle-click-emulation=false
natural-scroll=false

[org/gnome/desktop/peripherals/touchpad]
two-finger-scrolling-enabled=true
